    train_images: "A:/SatQuery-AI-Data/RSVQA-HR/USGS_split_train_images.json"
  cdvqa:
    root: "A:/SatQuery-AI-Data/CDVQA"
    train_questions: "A:/SatQuery-AI-Data/CDVQA/Train_questions.json"
    train_answers: "A:/SatQuery-AI-Data/CDVQA/Train_answers.json"
    train_images: "A:/SatQuery-AI-Data/CDVQA/Train_images.json"
  bigearthnet_txt:
    root: "A:/SatQuery-AI-Data/BigEarthNet.txt"
