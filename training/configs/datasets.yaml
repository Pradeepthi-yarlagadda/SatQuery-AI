data_root: "A:/SatQuery-AI-Data"

datasets:
  vrsbench:
    root: "A:/SatQuery-AI-Data/VRSBench"
    train_json: "A:/SatQuery-AI-Data/VRSBench/VRSBench_train.json"
    val_vqa: "A:/SatQuery-AI-Data/VRSBench/VRSBench_EVAL_vqa.json"
    val_caption: "A:/SatQuery-AI-Data/VRSBench/VRSBench_EVAL_Cap.json"
    val_grounding: "A:/SatQuery-AI-Data/VRSBench/VRSBench_EVAL_referring.json"
